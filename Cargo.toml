[workspace]
members = [
    "program",
    "clients/rust",
    "integration_tests",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/solana-foundation/solana-record-service"

[workspace.lints.rust]
unused_imports = "deny"
dead_code = "warn"
unused_variables = "warn"
deprecated = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[workspace.dependencies]
borsh = "1.5.5"
codama = "0.9.3"
litesvm = "0.12.0"
num-derive = "0.4"
num-traits = "0.2"
pinocchio = { version = "0.11.2", features = ["account-resize", "cpi"] }
pinocchio-associated-token-account = "0.4.0"
pinocchio-system = "0.6.1"
pinocchio-token-2022 = "0.4.0"
serde_json = "1.0"
solana-account = "~3.4"
solana-account-info = "~3.1"
solana-address = { version = "2.8.0", features = ["curve25519", "decode"] }
solana-cpi = "~3.1"
solana-instruction = "3.1"
solana-instruction-error = "2.0"
solana-keypair = "3.1"
solana-program-error = "~3.0"
solana-program-pack = "3.0"
solana-record = { path = "clients/rust" }
solana-rpc-client = "3.1.8"
solana-signer = "3.0"
solana-transaction = "3.0"
solana-transaction-error = "3.0"
spl-associated-token-account-interface = "2.0.0"
spl-collections = { version = "0.1.2", features = ["borsh"] }
spl-token-2022-interface = "3.1.2"
spl-token-group-interface = "0.7.2"
spl-token-metadata-interface = "1.0.1"
thiserror = "2.0"
