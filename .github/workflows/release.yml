name: Release

on:
  workflow_dispatch:
    inputs:
      network:
        description: Target network
        type: choice
        options: [devnet, mainnet]
        required: true
      priority-fee:
        description: Priority fee (microlamports per CU)
        type: string
        default: '100000'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.network }}
  cancel-in-progress: false

env:
  PROGRAM: srs
  PROGRAM_ID: srsWjm76StJucL7atFyPSdXFaVLNPFqEt1uFEDPrZsn
  REPO_URL: https://github.com/solana-foundation/solana-record-service
  BASE_IMAGE: solanafoundation/solana-verifiable-build:3.1.14
  SOLANA_VERSION: v4.3.0

jobs:
  release:
    name: Release ${{ inputs.network }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.network }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Guard source branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/heads/release/program-v1 ]]; then
            echo "::error::Release must be run from release/program-v1. Current ref: $REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://release.anza.xyz/$SOLANA_VERSION/install" | sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install solana-verify
        run: cargo install solana-verify --locked

      - name: Build verified program
        uses: solana-foundation/github-actions/build-verified@e6ed2eb93c55eca911dbc711fb08683b42926a28
        with:
          program: ${{ env.PROGRAM }}
          base-image: ${{ env.BASE_IMAGE }}

      # Fetch secrets only after toolchain setup (third-party actions and the remote
      # Solana installer) and the build have run, so deploy credentials are never
      # present in the environment while untrusted setup or build code executes.
      - name: Load deploy config from Doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          doppler-project: solana-record-service
          doppler-config: ${{ inputs.network == 'mainnet' && 'prd_github' || 'stg_github' }}
          inject-env-vars: true

      - name: Materialize deployer keypair
        run: |
          install -m 600 /dev/null /tmp/deployer.json
          printf '%s' "$DEPLOYER_KEYPAIR" > /tmp/deployer.json

      - name: Derive deployer pubkey
        id: deployer
        run: |
          PUBKEY=$(solana-keygen pubkey /tmp/deployer.json)
          echo "pubkey=$PUBKEY" >> "$GITHUB_OUTPUT"

      - name: Configure Solana CLI
        run: solana config set --url "$RPC_URL" --keypair /tmp/deployer.json > /dev/null

      # ExtendProgram is payer-signed while ExtendProgramChecked is inactive, and
      # SIMD-0431 rejects extensions under 10 KiB once active.
      - name: Extend program data if the new binary is larger
        run: |
          NEW_LEN=$(stat -c %s "target/deploy/$PROGRAM.so")
          CURRENT_LEN=$(solana program show "$PROGRAM_ID" --output json | jq -r .dataLen)
          if (( NEW_LEN > CURRENT_LEN )); then
            BYTES=$(( NEW_LEN - CURRENT_LEN ))
            (( BYTES < 10240 )) && BYTES=10240
            solana program extend "$PROGRAM_ID" "$BYTES"
          fi

      - id: write-buffer
        if: inputs.network == 'devnet'
        name: Write program buffer
        uses: solana-foundation/github-actions/write-program-buffer@e6ed2eb93c55eca911dbc711fb08683b42926a28
        with:
          program: ${{ env.PROGRAM }}
          program-id: ${{ env.PROGRAM_ID }}
          rpc-url: ${{ env.RPC_URL }}
          keypair: ${{ env.DEPLOYER_KEYPAIR }}
          buffer-authority-address: ${{ steps.deployer.outputs.pubkey }}
          priority-fee: ${{ inputs.priority-fee }}

      - if: inputs.network == 'devnet'
        name: Upgrade program (devnet)
        uses: solana-foundation/github-actions/program-upgrade@e6ed2eb93c55eca911dbc711fb08683b42926a28
        with:
          program: ${{ env.PROGRAM }}
          program-id: ${{ env.PROGRAM_ID }}
          buffer: ${{ steps.write-buffer.outputs.buffer }}
          rpc-url: ${{ env.RPC_URL }}
          keypair: ${{ env.DEPLOYER_KEYPAIR }}

      - if: inputs.network == 'mainnet'
        name: Validate Squads config
        run: |
          : "${SQUADS_VAULT:?Set SQUADS_VAULT in Doppler prd_github}"
          : "${SQUADS_MULTISIG:?Set SQUADS_MULTISIG in Doppler prd_github}"

      - if: inputs.network == 'mainnet'
        id: prepare-squads-release
        name: Prepare Squads release buffer (mainnet)
        uses: solana-foundation/github-actions/prepare-squads-release@e6ed2eb93c55eca911dbc711fb08683b42926a28
        with:
          program: ${{ env.PROGRAM }}
          program-id: ${{ env.PROGRAM_ID }}
          rpc-url: ${{ env.RPC_URL }}
          keypair: ${{ env.DEPLOYER_KEYPAIR }}
          squads-vault: ${{ env.SQUADS_VAULT }}
          priority-fee: ${{ inputs.priority-fee }}

      - if: inputs.network == 'mainnet'
        id: export-verify-tx
        name: Export verify PDA transaction (mainnet)
        uses: solana-foundation/github-actions/verify-build@e6ed2eb93c55eca911dbc711fb08683b42926a28
        with:
          program: ${{ env.PROGRAM }}
          program-id: ${{ env.PROGRAM_ID }}
          rpc-url: ${{ env.RPC_URL }}
          keypair: ${{ env.DEPLOYER_KEYPAIR }}
          repo-url: ${{ env.REPO_URL }}
          commit-hash: ${{ github.sha }}
          network: mainnet
          use-squads: 'true'
          vault-address: ${{ env.SQUADS_VAULT }}
          base-image: ${{ env.BASE_IMAGE }}

      - if: inputs.network == 'mainnet'
        id: export-squads-tx
        name: Export combined Squads transaction (mainnet)
        uses: solana-foundation/squads-program-action@572754d0b2e582bfc6bf2339f15d6dd2b9588246 # v0.5.1
        with:
          rpc: ${{ env.RPC_URL }}
          program: ${{ env.PROGRAM_ID }}
          buffer: ${{ steps.prepare-squads-release.outputs.buffer }}
          multisig: ${{ env.SQUADS_MULTISIG }}
          keypair: ${{ env.DEPLOYER_KEYPAIR }}
          pda-tx: ${{ steps.export-verify-tx.outputs.pda_tx }}
          export: 'true'

      - name: Cleanup keypair
        if: always()
        run: rm -f /tmp/deployer.json

      - name: Summary
        env:
          NETWORK: ${{ inputs.network }}
          BUFFER: ${{ inputs.network == 'mainnet' && steps.prepare-squads-release.outputs.buffer || steps.write-buffer.outputs.buffer }}
          SQUADS_TX: ${{ steps.export-squads-tx.outputs.tx }}
        run: |
          {
            echo "## Release: $NETWORK"
            echo ""
            echo "- Program: \`$PROGRAM_ID\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Executable hash: \`$(solana-verify get-executable-hash "target/deploy/$PROGRAM.so")\`"
            echo "- Buffer: \`$BUFFER\`"
            if [ "$NETWORK" = "mainnet" ]; then
              echo "- Buffer authority: \`$SQUADS_VAULT\`"
              echo "- Combined transaction (base58, verify PDA + program upgrade in one):"
              echo '```'
              echo "$SQUADS_TX"
              echo '```'
              echo "- **Action required**: import the combined transaction into the Squads transaction builder, then approve and execute"
              echo "- CI keypair role: fee payer and buffer writer only; it does not need Squads membership"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
